<body>
    <h2>Student Registration form</h2>

    <div class="form">
    <form action="submit">
       <label for="name">
        Name:</label>
        <input type="text" placeholder="Enter name"></label>
        <br><br>
        <label for="Address">
        
        Email:
        </label>
        <input type="email" placeholder="Enter email">
        <label>
            <br><br>
          Password:
        </label>
        <input type="password" placeholder="Enter password">
        <br><br>
        <label>
            Phone number:
        </label>
        <input type="tel" placeholder="Enter number">
        <br><br>
        <label>Date of birth:</label>
        <input type="date" >
     <br><br>
     <textarea cols="40" rows="8" placeholder="Enter your description...."></textarea>
    </form>
</div>
  <form>
        <h2>Gender:</h2>

    <br>
    <br>
