<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>Document</title>
</head>
<body>
    <h1>Student Registration form</h1>
    <b>
        <fieldset>
    <form>
    
        <label>
            Name:
        </label>
        <input type="text" placeholder="Enter your name">
          &nbsp;
         <label>
           College:
        </label>
        <input type="text" value="Nepathya College" disabled>
        <br><br>
        <label>
            Email:
        </label>
        <input type="email" placeholder="enter email">
         &nbsp;
        <label>
            Password:
        </label>
        <input type="password" placeholder="Enter your password">
        <br><br>
        <label>
            Phone Number:
        </label>
        <input type="tel" placeholder="Enter your phone numb">
         &nbsp;
      <label>
        Date Of Birth:
      </label>
      <input type="date">
      <br><br>
    </fieldset>
      Favourite Programming Languages:</b>
      <fieldset>
      <br>
      <input type="checkbox" value="C">C
      <br>
      <input type="checkbox" value="C++">C++
      <br>
      <input type="checkbox" value="Javascript">Javascript
      <br><br>
      </fieldset>
      <b>
        
      Select your gender:
      </b>
      <fieldset>
      <br>
      <label>
      <input type="radio" name="gender">Male</label>
      <br>
      <label>
       <input type="radio" name="gender">Woman</label>
       <br><br>
      </fieldset>
       <b>
       Select Course:
       </b>
       <fieldset>
       <br>
       <select name="" id="">
         <option value="" disabled selected>Select course</option>
        <option value="BCA">BCA</option>
         <option value="BCA">Csit</option>
          <option value="BCA">BBA</option>
       </select>
       <br><br>
       <b>
       Upload your document <input type="file">    </b>
       <br><br>
       </fieldset>
       <b>
       Message/Feedback/Bio/Caption: 
       </b>
       <br>
       <textarea placeholder="Enter message/feedback/bio/caption" cols="50" rows="10"></textarea>

    </form>
    <br>
    <button>Register</button>

</body>
</html>
