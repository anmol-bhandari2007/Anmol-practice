<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="2" cellpadding="10px" style="width: 500px;">
        <tr>
        <th colspan="3">REGISTRATION FORM</th>
        </tr>
        <tr>
            <th>Full name</th>
            <th colspan="2">
                <input type="text">
            </th>
        </tr>
        <tr>
            <th>Username</th>
            <th colspan="2"><input type="text"></th>

        </tr>
        <tr>
            <th>Password</th>
            <th colspan="2"><input type="password"></th>
        </tr>
         <th>Date of Birth</th>
            <th colspan="2"><input type="date"></th>
        </tr>
         <th>Qualification</th>
         
         <td colspan="2">
            <ol type="1"><i>
            <li>A-Secondary</li>
            <li>B-Higher Secondary</li>
             <li>C-Bachelor</li>
              <li>A-Master</li>
               <li>B-Other</li>
               </i>
            </ol>

             </td>
        </tr>
        <tr>
            <th rowspan="2">Personal Details</th>
            <th>Subscript</th>
            <th>Superscript</th>
        </tr>
        <tr>
            <td>H<sub>2</sub>O</th>
            <td>x<sup>2</sup></th>

        </tr>
        <tr>
            <th>Test Formating</th>
            <td colspan="2"><b>Bold Text</b><br>
                <i>Italic Text</i>
            </td>
        </tr>
        <tr>
            <th>Website</th>
            <td colspan="2"><a href="https://www.google.com/" target="_blank">Visit Google</a></td>
        </tr>
        <tr>
            <th colspan="3"><button>Register</button>
            <input type="reset"></th>
        </tr>
    </table>
    
</body>
</html>
